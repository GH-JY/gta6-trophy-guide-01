<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Ledger — GTA VI trophy guide &amp; tracker</title>
<meta name="description" content="An offline guide and progress tracker for all 55 Grand Theft Auto VI PlayStation 5 trophies: guides with sources, a roadmap to the platinum, missable windows, filters and a spoiler shield.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="checklist">
<a class="skip-link" href="#main">Skip to the guide</a>
<h1 class="sr-only">Leonida Ledger — Grand Theft Auto VI trophy guide and tracker</h1>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">LL</span>
    <span class="brand-text">
      <span class="brand-name">Leonida Ledger</span>
      <span class="brand-sub">GTA VI trophy guide &amp; tracker</span>
    </span>
  </div>
  <nav class="tabs" aria-label="Screens">
    <button class="tab is-active" type="button" data-view="checklist">Checklist</button>
    <button class="tab" type="button" data-view="roadmap">Roadmap</button>
    <button class="tab" type="button" data-view="missables">Missables</button>
    <button class="tab" type="button" data-view="method">Method</button>
  </nav>
  <div class="progress-chip" id="progress-chip" aria-live="polite"></div>
</header>

<section class="toolbar" aria-label="Filters, spoiler setting and progress tools">
  <div class="toolbar-row">
    <label class="search">
      <span class="sr-only">Search trophies</span>
      <input id="search" type="search" placeholder="Search a trophy, a description or a guide" autocomplete="off" spellcheck="false">
    </label>
    <label class="select-wrap">
      <span>Grade</span>
      <select id="grade-filter">
        <option value="all">All grades</option>
        <option value="platinum">Platinum</option>
        <option value="gold">Gold</option>
        <option value="silver">Silver</option>
        <option value="bronze">Bronze</option>
      </select>
    </label>
    <label class="switch" title="Hide the names and descriptions of unearned story trophies">
      <input id="spoiler-toggle" type="checkbox">
      <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
      <span class="switch-text">Spoiler shield</span>
    </label>
    <div class="tool-actions">
      <button id="export-btn" class="btn btn-small" type="button">Export</button>
      <label class="btn btn-small btn-ghost import-label">Import<input id="import-input" type="file" accept="application/json,.json"></label>
    </div>
  </div>
  <div class="toolbar-row toolbar-row-2">
    <div class="chips" id="kind-chips" role="group" aria-label="Filter trophies by kind"></div>
    <button id="missable-toggle" class="chip chip-miss" type="button" aria-pressed="false">Missable <span class="chip-n" id="missable-count">12</span></button>
    <button id="clear-filters" class="link-btn" type="button">Clear filters</button>
  </div>
</section>

<main id="main">
  <section class="view" id="view-checklist" aria-label="Trophy checklist">
    <div class="split">
      <section class="list-pane" aria-label="The 55 trophies">
        <div class="list-head">
          <div>
            <h2 class="list-title" id="list-title">All 55 trophies</h2>
            <p class="list-sub" id="list-sub">Official PlayStation 5 list · 1 platinum, 2 gold, 6 silver, 46 bronze</p>
          </div>
          <span class="list-count" id="list-count"></span>
        </div>
        <ul class="trophy-list" id="trophy-list"></ul>
      </section>
      <aside class="detail-pane" id="detail" aria-label="Trophy guide"></aside>
    </div>
  </section>

  <section class="view" id="view-roadmap" aria-label="Roadmap to the platinum" hidden></section>
  <section class="view" id="view-missables" aria-label="Missable trophies" hidden></section>
  <section class="view" id="view-method" aria-label="How this guide is built" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
